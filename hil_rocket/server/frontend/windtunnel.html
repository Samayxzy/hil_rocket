<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MONK HIL — Wind Tunnel</title>
<style>
:root {
  --bg:      #090c10;
  --bg-p:    #0d1117;
  --bg-c:    #111820;
  --border:  #1e2d3d;
  --border-h:#2a3f55;
  --teal:    #22d3ee;
  --teal-d:  #0e7490;
  --orange:  #f97316;
  --green:   #22c55e;
  --text:    #e2e8f0;
  --dim:     #64748b;
  --mid:     #94a3b8;
  --mono:    'JetBrains Mono','Fira Code','Courier New',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:12px}
body{display:flex;flex-direction:column}

#hdr{display:flex;align-items:center;gap:10px;padding:0 12px;height:40px;background:var(--bg-p);border-bottom:1px solid var(--border);flex-shrink:0}
.logo{font-size:13px;font-weight:700;letter-spacing:.15em;color:var(--teal)}
.logo span{color:var(--dim);font-weight:400}
.pill{font-size:9px;padding:2px 7px;border-radius:3px;letter-spacing:.1em;border:1px solid var(--teal-d);background:rgba(34,211,238,.1);color:var(--teal)}
#ws-status{margin-left:auto;font-size:9px;color:var(--dim)}

#controls{display:flex;align-items:center;gap:14px;padding:7px 12px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg-p)}
.ctrl-group{display:flex;align-items:center;gap:7px}
.ctrl-label{font-size:9px;color:var(--dim);letter-spacing:.1em}
input[type=range]{accent-color:var(--teal);width:120px}
.ctrl-val{font-size:12px;color:var(--teal);min-width:46px}
.divider{width:1px;height:20px;background:var(--border)}
.mode-btn{background:var(--bg-c);border:1px solid var(--border);color:var(--dim);font-family:var(--mono);font-size:9px;padding:3px 10px;border-radius:3px;cursor:pointer;letter-spacing:.08em}
.mode-btn.active{background:rgba(34,211,238,.1);border-color:var(--teal-d);color:var(--teal)}

#legend{display:flex;align-items:center;gap:0;margin-left:auto}
.leg-bar{width:100px;height:8px;border-radius:2px;background:linear-gradient(to right,#0032c8,#22d3ee,#22c55e,#eab308,#f97316,#ef4444)}
.leg-lo{font-size:8px;color:var(--dim);margin-right:4px}
.leg-hi{font-size:8px;color:var(--dim);margin-left:4px}

#tunnel-wrap{flex:1;position:relative;overflow:hidden}
#tunnel-canvas{width:100%;height:100%;display:block}
.ov-label{position:absolute;font-size:9px;letter-spacing:.1em;pointer-events:none;padding:2px 5px;background:rgba(9,12,16,.7);border-radius:3px}
#ov-cp{color:var(--orange)}
#ov-aoa-val{top:8px;right:10px;font-size:11px;color:var(--teal);background:rgba(9,12,16,.7);padding:3px 8px;border-radius:3px}

#stats{display:flex;border-top:1px solid var(--border);flex-shrink:0;background:var(--bg-p)}
.stat-cell{flex:1;padding:6px 10px;border-right:1px solid var(--border);text-align:center}
.stat-cell:last-child{border-right:none}
.stat-cell .sk{font-size:8px;color:var(--dim);letter-spacing:.1em;margin-bottom:2px}
.stat-cell .sv{font-size:13px;color:var(--teal)}

#charts{display:flex;flex-direction:column;height:200px;flex-shrink:0;border-top:1px solid var(--border)}
.chart-row{flex:1;position:relative;border-bottom:1px solid var(--border)}
.chart-row:last-child{border-bottom:none}
.chart-title{position:absolute;top:4px;left:8px;font-size:8px;color:var(--dim);letter-spacing:.1em;z-index:1}
.chart-cursor-val{position:absolute;top:4px;right:8px;font-size:9px;color:var(--teal)}
.chart-ymax{position:absolute;top:16px;right:4px;font-size:8px;color:var(--dim)}
.chart-ymin{position:absolute;bottom:4px;right:4px;font-size:8px;color:var(--dim)}
canvas.cc{width:100%;height:100%;display:block;cursor:crosshair}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--border)}
</style>
</head>
<body>

<div id="hdr">
  <div class="logo">MONK <span>·</span> HIL</div>
  <div class="pill">WIND TUNNEL</div>
  <span id="ws-status">connecting...</span>
  <div id="legend">
    <span class="leg-lo">SLOW</span>
    <div class="leg-bar"></div>
    <span class="leg-hi">FAST</span>
  </div>
</div>

<div id="controls">
  <div class="ctrl-group">
    <span class="ctrl-label">AoA</span>
    <input type="range" id="aoa-slider" min="-20" max="20" value="0" step="0.5">
    <span class="ctrl-val" id="aoa-val">0.0°</span>
  </div>
  <div class="divider"></div>
  <div class="ctrl-group">
    <span class="ctrl-label">AIRSPEED</span>
    <input type="range" id="spd-slider" min="5" max="150" value="30" step="1">
    <span class="ctrl-val" id="spd-val">30 m/s</span>
  </div>
  <div class="divider"></div>
  <div class="ctrl-group">
    <span class="ctrl-label">MODE</span>
    <button class="mode-btn active" id="btn-manual" onclick="setMode('manual')">MANUAL</button>
    <button class="mode-btn" id="btn-live" onclick="setMode('live')">LIVE SIM</button>
  </div>
</div>

<div id="tunnel-wrap">
  <canvas id="tunnel-canvas"></canvas>
  <div class="ov-label" id="ov-cp" style="display:none">◆ Cp</div>
  <div class="ov-label" id="ov-aoa-val">AoA: 0.0°</div>
</div>

<div id="stats">
  <div class="stat-cell"><div class="sk">Cp FROM NOSE</div><div class="sv" id="st-cp">—</div></div>
  <div class="stat-cell"><div class="sk">Cd AT AoA</div><div class="sv" id="st-cd">—</div></div>
  <div class="stat-cell"><div class="sk">DRAG FORCE</div><div class="sv" id="st-drag">—</div></div>
  <div class="stat-cell"><div class="sk">DYN PRESSURE</div><div class="sv" id="st-q">—</div></div>
  <div class="stat-cell"><div class="sk">LIVE AoA</div><div class="sv" id="st-aoa-live">—</div></div>
</div>

<div id="charts">
  <div class="chart-row">
    <div class="chart-title">Cd vs AoA</div>
    <div class="chart-cursor-val" id="cv-cd">—</div>
    <div class="chart-ymax" id="cy-cd-max"></div>
    <div class="chart-ymin" id="cy-cd-min"></div>
    <canvas class="cc" id="ch-cd"></canvas>
  </div>
  <div class="chart-row">
    <div class="chart-title">STABILITY MARGIN vs AoA (calibers)</div>
    <div class="chart-cursor-val" id="cv-sm">—</div>
    <div class="chart-ymax" id="cy-sm-max"></div>
    <div class="chart-ymin" id="cy-sm-min"></div>
    <canvas class="cc" id="ch-sm"></canvas>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════
let mode        = 'manual';
let aoaDeg      = 0;
let airspeed    = 30;
let aeroData    = null;
let domain      = null;      // { L, R, domW, zMin, zMax }
let streamlines = [];        // array of [{z,x,speedMult}, ...] — STATIC, recomputed on param change
const N_LINES  = 48;   // reduced from 70 — still visually dense, notably cheaper per retrace
const N_STEPS  = 130;  // reduced from 200 — smooth curves don't need this many RK4 steps
const RHO = 1.225;

// ═══════════════════════════════════════════════════════════════════════════
// CONTROLS
// ═══════════════════════════════════════════════════════════════════════════
document.getElementById('aoa-slider').addEventListener('input', e => {
  aoaDeg = parseFloat(e.target.value);
  document.getElementById('aoa-val').textContent    = aoaDeg.toFixed(1) + '°';
  document.getElementById('ov-aoa-val').textContent = 'AoA: ' + aoaDeg.toFixed(1) + '°';
  scheduleRetrace();
});
document.getElementById('spd-slider').addEventListener('input', e => {
  airspeed = parseFloat(e.target.value);
  document.getElementById('spd-val').textContent = airspeed.toFixed(0) + ' m/s';
  updateStats(); drawCharts();
});
function setMode(m) {
  mode = m;
  document.getElementById('btn-manual').className = 'mode-btn' + (m==='manual'?' active':'');
  document.getElementById('btn-live').className   = 'mode-btn' + (m==='live'  ?' active':'');
}

// ═══════════════════════════════════════════════════════════════════════════
// COLOUR MAP
// ═══════════════════════════════════════════════════════════════════════════
function speedColor(normT) {
  const t = Math.max(0, Math.min(1, normT));
  const stops = [
    [0,   [  0,  60, 190]],
    [0.22,[  0, 180, 255]],
    [0.42,[ 20, 220, 130]],
    [0.62,[190, 220,   0]],
    [0.80,[255, 150,   0]],
    [1.0, [235,  25,  25]],
  ];
  for (let i = 0; i < stops.length - 1; i++) {
    const [t0, c0] = stops[i], [t1, c1] = stops[i+1];
    if (t <= t1) {
      const s = (t - t0) / (t1 - t0);
      return [
        Math.round(c0[0] + s*(c1[0]-c0[0])),
        Math.round(c0[1] + s*(c1[1]-c0[1])),
        Math.round(c0[2] + s*(c1[2]-c0[2])),
      ];
    }
  }
  return [235, 25, 25];
}
function rgbStr(rgb, a=1) { return `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`; }

// ═══════════════════════════════════════════════════════════════════════════
// ROCKET PROFILE
// Uses the ACTUAL radius profile extracted from the uploaded STL when
// available (aeroData.profile), falling back to a generic ogive+cylinder
// shape only if no profile data has been fetched yet.
// ═══════════════════════════════════════════════════════════════════════════
let rocketProfile = null;   // { zArr: Float64Array, rArr: Float64Array } sorted tail(0) -> nose(L)

function setRocketProfile(profileList) {
  if (!profileList || profileList.length < 2) { rocketProfile = null; return; }
  const zArr = new Float64Array(profileList.length);
  const rArr = new Float64Array(profileList.length);
  profileList.forEach((p, i) => { zArr[i] = p.z; rArr[i] = p.r; });
  rocketProfile = { zArr, rArr };
}

function interpProfile(z) {
  const { zArr, rArr } = rocketProfile;
  const n = zArr.length;
  if (z <= zArr[0]) return rArr[0];
  if (z >= zArr[n-1]) return rArr[n-1];
  let lo = 0, hi = n - 1;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (zArr[mid] <= z) lo = mid; else hi = mid;
  }
  const t = (z - zArr[lo]) / (zArr[hi] - zArr[lo] || 1e-9);
  return rArr[lo] + t * (rArr[hi] - rArr[lo]);
}

function rocketRadius(z, L, R) {
  if (z < 0 || z > L) return 0;
  if (rocketProfile) return interpProfile(z);
  const noseL = L * 0.17;
  const bodyZ = L - noseL;
  if (z > bodyZ) {
    const t = (L - z) / noseL;
    return R * Math.sqrt(Math.max(0, 1 - (1-t)*(1-t)));
  }
  return R;
}

// World <-> body-frame rotation helpers. World coordinates (zw, xw) are
// the FIXED display/domain frame — the wind tunnel's airflow always
// enters straight down the canvas in world coordinates, exactly like a
// real wind tunnel's fixed airflow. Body coordinates (zb, xb) are aligned
// with the ROCKET's own axis. AoA is realised by rotating the ROCKET
// (i.e. rotating the mapping between these two frames) rather than by
// tilting the freestream direction — matching how a real model rotates
// on its sting mount while the tunnel itself stays fixed.
function bodyToWorld(zb, xb, aoaRad) {
  const zw =  zb*Math.cos(aoaRad) - xb*Math.sin(aoaRad);
  const xw =  zb*Math.sin(aoaRad) + xb*Math.cos(aoaRad);
  return [zw, xw];
}
function worldToBody(zw, xw, aoaRad) {
  const zb =  zw*Math.cos(aoaRad) + xw*Math.sin(aoaRad);
  const xb = -zw*Math.sin(aoaRad) + xw*Math.cos(aoaRad);
  return [zb, xb];
}

// ═══════════════════════════════════════════════════════════════════════════
// VALIDATED RING-SOURCE POTENTIAL FLOW
//
// Backend (aero/flow_field.py) solves for source-ring strengths that
// satisfy the exact no-penetration boundary condition on the real rocket
// surface — validated against a known exact case (sphere flow, matched
// textbook result to within 0.01%), and checked for self-consistency
// (reconstructs the real body shape via normal-velocity residual under
// ~1-2% along the vast majority of body length; known, characterised
// softening to ~10-25% only in the last ~5% of a sharp nose tip, a
// well-known hard case for any finite panel method).
//
// Ring strengths (q_unit) were solved for UNIT axial freestream — they
// scale linearly with actual airspeed*cos(AoA) at evaluation time. The
// crossflow component (airspeed*sin(AoA)) is added as a simple uniform
// term — first-order slender-body AoA decomposition, not a fully
// rigorous 3D solve (stated plainly, not overclaimed).
// ═══════════════════════════════════════════════════════════════════════════
let flowField = null;   // { zRings, rRings, qUnit, M } from backend solve

function setFlowField(ff) {
  if (!ff || !ff.z_rings || ff.z_rings.length < 2) { flowField = null; return; }
  flowField = {
    zRings: new Float64Array(ff.z_rings),
    rRings: new Float64Array(ff.r_rings),
    qUnit:  new Float64Array(ff.q_unit),
    M:      ff.m_points,
    cosPhi: null, sinPhi: null,
  };
  const M = flowField.M;
  const cosPhi = new Float64Array(M), sinPhi = new Float64Array(M);
  for (let k = 0; k < M; k++) {
    const phi = (2*Math.PI*k)/M;
    cosPhi[k] = Math.cos(phi); sinPhi[k] = Math.sin(phi);
  }
  flowField.cosPhi = cosPhi; flowField.sinPhi = sinPhi;
}

// Real physics velocity evaluation — sums the solved ring sources
// (reusing the same validated point-source formula throughout, no new
// hand-derived formulas introduced at evaluation time).
// Body-frame velocity given an EXPLICIT axial/cross freestream
// decomposition already expressed IN BODY COORDINATES (Uaxial along the
// body's own axis, Ucross perpendicular to it). Disturbance is scaled
// by Uaxial since the backend's Q_unit ring strengths were solved for a
// unit AXIAL body-frame inflow (see aero/flow_field.py) — this part is
// unchanged validated physics.
function ringSourceVelocityBody(zb, xb, Uaxial, Ucross) {
  if (!flowField) return { vz: Uaxial, vx: Ucross, speedMult: 1.0 };

  const { zRings, rRings, qUnit, M, cosPhi, sinPhi } = flowField;
  const N = zRings.length;
  let vzDist = 0, vxDist = 0;

  for (let j = 0; j < N; j++) {
    const rj = rRings[j], zj = zRings[j], Qj = qUnit[j];
    if (Qj === 0) continue;
    const fac0 = Qj / M / (4*Math.PI);
    for (let k = 0; k < M; k++) {
      const qx = rj*cosPhi[k], qy = rj*sinPhi[k];
      const dx = xb - qx, dy = -qy, dzp = zb - zj;
      const dist2 = dx*dx + dy*dy + dzp*dzp;
      const dist3 = Math.max(dist2, 1e-10) ** 1.5;
      const fac = fac0 / dist3;
      vxDist += fac * dx;
      vzDist += fac * dzp;
    }
  }

  const vz = Uaxial + Uaxial * vzDist;
  const vx = Ucross + Uaxial * vxDist;
  const speedMult = Math.hypot(vz, vx) / Math.max(Math.hypot(Uaxial, Ucross), 1e-6);
  return { vz, vx, speedMult };
}

// Rotates a WORLD-frame query point into the rocket's own body-aligned
// frame, evaluates the validated ring-source solution there using the
// CORRECTLY-ROTATED freestream baseline, then rotates the result back
// to world frame.
//
// BUG FIX (previously shipped, caught by inspection): the first version
// of this function used a bare "pure axial" baseline (airspeed, 0)
// inside the body-frame evaluation, then rotated the SUM back to world.
// That's wrong — it made the entire far-field flow (not just the local
// disturbance near the rocket) rotate along with the rocket, so the
// whole streamline field appeared uniformly sheared even far above the
// nose. The fix: the WORLD freestream is always purely vertical
// (airspeed, 0) — that FIXED vector must itself be rotated into body
// coordinates first to get the baseline the body "feels", and it's that
// baseline (not a bare axial guess) that combines with the disturbance
// before rotating back. Verified numerically: far from the body
// (disturbance -> 0), this reconstruction now recovers EXACTLY
// (airspeed, 0) in world frame regardless of AoA, as it must.
function worldVelocity(zw, xw, airspeed, aoaDeg) {
  const aoaRad = aoaDeg * Math.PI / 180;
  const [zb, xb] = worldToBody(zw, xw, aoaRad);
  const [UaxialBody, UcrossBody] = worldToBody(airspeed, 0, aoaRad);
  const { vz: vzb, vx: vxb, speedMult } = ringSourceVelocityBody(zb, xb, UaxialBody, UcrossBody);
  const [vzw, vxw] = bodyToWorld(vzb, vxb, aoaRad);
  return { vz: vzw, vx: vxw, speedMult };
}

// dx/dz slope for streamline integration — derived from the real velocity
// field, not a separate hand-tuned formula.
function fieldSlopeAt(z, x, L, R, airspeed, aoaDeg) {
  const { vz, vx, speedMult } = worldVelocity(z, x, airspeed, aoaDeg);
  const safeVz = Math.abs(vz) < 1e-6 ? (vz < 0 ? -1e-6 : 1e-6) : vz;
  return { dxdz: vx / safeVz, speedMult };
}

// ═══════════════════════════════════════════════════════════════════════════
// STATIC STREAMLINE TRACING (RK4) — computed once per parameter change
// ═══════════════════════════════════════════════════════════════════════════
function traceStreamline(x0, dom, aoaDegLocal, nSteps, airspeedLocal) {
  const { L, R, zMin, zMax } = dom;
  const aoaRad = aoaDegLocal * Math.PI / 180;
  const h = -(zMax - zMin) / nSteps;

  function f(zz, xx) {
    return fieldSlopeAt(zz, xx, L, R, airspeedLocal, aoaDegLocal).dxdz;
  }

  let z = zMax, x = x0;
  const pts = [];

  for (let i = 0; i <= nSteps; i++) {
    const info = fieldSlopeAt(z, x, L, R, airspeedLocal, aoaDegLocal);
    pts.push({ z, x, speedMult: info.speedMult });
    if (i === nSteps) break;

    const k1 = f(z, x);
    const k2 = f(z + h/2, x + (h/2)*k1);
    const k3 = f(z + h/2, x + (h/2)*k2);
    const k4 = f(z + h,   x + h*k3);
    let xNew = x + (h/6)*(k1 + 2*k2 + 2*k3 + k4);
    const zNew = z + h;

    // rocketRadius() is defined along the ROCKET's own body axis, which
    // is now tilted relative to world/display coordinates whenever
    // aoaDeg != 0 — so the candidate point must be converted into body
    // coordinates before checking whether it's landed inside the body.
    const [zb, xb] = worldToBody(zNew, xNew, aoaRad);
    const rNew = rocketRadius(zb, L, R);
    if (Math.abs(xb) < rNew * 1.01) {
      const xbPushed = rNew * 1.05 * (xb === 0 ? (x === 0 ? 1 : Math.sign(x)) : Math.sign(xb));
      const [, xwPushed] = bodyToWorld(zb, xbPushed, aoaRad);
      xNew = xwPushed;
    }

    z = zNew; x = xNew;
  }
  return pts;
}

function computeDomain(ad) {
  const L = ad.rocket_length;
  const R = ad.rocket_diameter / 2;
  return {
    L, R,
    domW: R * 6.0,
    zMin: -0.25 * L,
    zMax:  1.18 * L,
  };
}

function rebuildStreamlines() {
  if (!aeroData || !aeroData.rocket_length) return;
  domain = computeDomain(aeroData);
  streamlines = [];
  for (let i = 0; i < N_LINES; i++) {
    const x0 = -domain.domW*0.92 + (i/(N_LINES-1)) * domain.domW*1.84;
    streamlines.push(traceStreamline(x0, domain, aoaDeg, N_STEPS, airspeed));
  }
  updateStats();
  drawCharts();
}

// Throttled retrace — the full 70-line x 200-step RK4 retrace (each step
// summing a 90-ring x 32-point source field) is genuinely expensive.
// Triggering it on every slider 'input' event (which fires dozens of
// times per second while dragging) or on every 20Hz WebSocket update in
// LIVE SIM mode queued up retraces far faster than the browser could
// finish them — that's what caused the freeze-then-jump-to-a-stale-frame
// behaviour. This bounds it to at most ~10 retraces/second regardless of
// trigger source, with a trailing call so the final settled value is
// always eventually reflected. The rocket silhouette itself is NOT
// gated by this — draw() redraws it fresh every animation frame directly
// from the live aoaDeg value, so rotation always looks instant even
// while the streamline paths lag up to ~100ms behind.
let lastRetraceTime   = 0;
let pendingRetrace    = false;
const RETRACE_MIN_MS  = 160;   // widened from 100ms — more headroom on slower machines

function scheduleRetrace() {
  const now = performance.now();
  const elapsed = now - lastRetraceTime;
  if (elapsed >= RETRACE_MIN_MS) {
    lastRetraceTime = now;
    rebuildStreamlines();
  } else if (!pendingRetrace) {
    pendingRetrace = true;
    setTimeout(() => {
      pendingRetrace = false;
      lastRetraceTime = performance.now();
      rebuildStreamlines();
    }, RETRACE_MIN_MS - elapsed);
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// CANVAS + COORD MAPPING
// ═══════════════════════════════════════════════════════════════════════════
const canvas = document.getElementById('tunnel-canvas');
const ctx    = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width  = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
}
resizeCanvas();
new ResizeObserver(resizeCanvas).observe(canvas);   // streamlines are in physical units — no retrace needed on resize

function toCv(z, x) {
  if (!domain) return [0, 0];
  const W = canvas.width, H = canvas.height;
  const padFrac = 0.05;
  const availW = W * (1 - 2*padFrac);
  const availH = H * (1 - 2*padFrac);

  const domainW = 2 * domain.domW;
  const domainH = domain.zMax - domain.zMin;

  // Single uniform scale (px per metre) — whichever dimension is more
  // constraining sets the scale, so the rocket's true proportions are
  // preserved no matter what shape the window/canvas is.
  const scale = Math.min(availW / domainW, availH / domainH);

  const usedW = domainW * scale;
  const usedH = domainH * scale;
  const offX  = (W - usedW) / 2;
  const offY  = (H - usedH) / 2;

  const cx = offX + (x + domain.domW) * scale;
  const cy = offY + (1 - (z - domain.zMin) / domainH) * usedH;
  return [cx, cy];
}

// ═══════════════════════════════════════════════════════════════════════════
// DRAW LOOP — static polylines, animated dash-offset for flow direction
// ═══════════════════════════════════════════════════════════════════════════
let dashOffset     = 0;
let lastFrameTime  = performance.now();

function draw() {
  const now = performance.now();
  const dt  = Math.min(0.05, (now - lastFrameTime) / 1000);
  lastFrameTime = now;

  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = '#090c10';
  ctx.fillRect(0, 0, W, H);

  if (!domain || !streamlines.length) {
    ctx.fillStyle = 'rgba(100,116,139,0.5)';
    ctx.font = '13px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('Upload a rocket assembly on the launch screen first', W/2, H/2);
    ctx.textAlign = 'left';
    return;
  }

  dashOffset -= dt * (18 + airspeed * 1.4);

  // ── Streamlines ──────────────────────────────────────────────────────
  ctx.setLineDash([7, 6]);
  ctx.lineWidth = 1.3;
  for (const pts of streamlines) {
    if (pts.length < 2) continue;
    const first = toCv(pts[0].z, pts[0].x);
    const last  = toCv(pts[pts.length-1].z, pts[pts.length-1].x);

    let grad;
    try {
      grad = ctx.createLinearGradient(first[0], first[1], last[0], last[1]);
      const stops = 8;
      for (let s = 0; s <= stops; s++) {
        const frac = s / stops;
        const idx  = Math.min(pts.length-1, Math.round(frac*(pts.length-1)));
        const rgb  = speedColor(pts[idx].speedMult / 1.55);
        grad.addColorStop(frac, rgbStr(rgb, 0.85));
      }
    } catch(e) { continue; }

    ctx.beginPath();
    ctx.moveTo(first[0], first[1]);
    for (let i = 1; i < pts.length; i++) {
      const [cx, cy] = toCv(pts[i].z, pts[i].x);
      ctx.lineTo(cx, cy);
    }
    ctx.strokeStyle = grad;
    ctx.lineDashOffset = dashOffset;
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // ── Rocket silhouette ────────────────────────────────────────────────
  // Silhouette is defined in the rocket's own BODY frame (tail z=0 ->
  // nose z=L), then rotated into world/display coordinates each frame
  // using the LIVE aoaDeg value — this is what makes the rocket visibly
  // rotate as AoA changes, independent of and much cheaper than the
  // full streamline retrace (which is throttled separately below).
  const { L, R } = domain;
  const aoaRad = aoaDeg * Math.PI / 180;
  const nSeg = 140;
  const silPts = Array.from({length: nSeg}, (_, i) => {
    const zb = L * i / (nSeg - 1);
    return { zb, r: rocketRadius(zb, L, R) };
  }).filter(p => p.r > 1e-4);

  if (silPts.length > 1) {
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    let first = true;
    for (const p of silPts) {
      const [zw, xw] = bodyToWorld(p.zb, p.r, aoaRad);
      const [cx, cy] = toCv(zw, xw);
      first ? ctx.moveTo(cx, cy) : ctx.lineTo(cx, cy);
      first = false;
    }
    for (let i = silPts.length - 1; i >= 0; i--) {
      const [zw, xw] = bodyToWorld(silPts[i].zb, -silPts[i].r, aoaRad);
      const [cx, cy] = toCv(zw, xw);
      ctx.lineTo(cx, cy);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(10,25,50,0.92)';
    ctx.fill();

    ctx.strokeStyle = '#22d3ee'; ctx.lineWidth = 1.5;
    ctx.beginPath(); first = true;
    for (const p of silPts) {
      const [zw, xw] = bodyToWorld(p.zb, p.r, aoaRad);
      const [cx, cy] = toCv(zw, xw);
      first ? ctx.moveTo(cx, cy) : ctx.lineTo(cx, cy);
      first = false;
    }
    ctx.stroke();

    ctx.beginPath(); first = true;
    for (const p of silPts) {
      const [zw, xw] = bodyToWorld(p.zb, -p.r, aoaRad);
      const [cx, cy] = toCv(zw, xw);
      first ? ctx.moveTo(cx, cy) : ctx.lineTo(cx, cy);
      first = false;
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Centreline — the rocket's own body axis (tail to nose), rotated into
  // world coordinates, so it visibly tilts along with the rocket.
  ctx.setLineDash([4,5]); ctx.lineWidth = 0.6; ctx.strokeStyle = 'rgba(34,211,238,0.2)';
  ctx.beginPath();
  const [nzw, nxw] = bodyToWorld(L, 0, aoaRad);
  const [tzw, txw] = bodyToWorld(0, 0, aoaRad);
  const [c0x,c0y] = toCv(nzw, nxw), [c1x,c1y] = toCv(tzw, txw);
  ctx.moveTo(c0x,c0y); ctx.lineTo(c1x,c1y); ctx.stroke();
  ctx.setLineDash([]);

  // ── Cp marker ─────────────────────────────────────────────────────────
  // Drawn PERPENDICULAR to the rocket's own (now possibly tilted) axis,
  // not simply horizontal — a fixed horizontal line would look
  // disconnected from the body once it rotates.
  if (aeroData && aeroData.cp_from_nose) {
    const cpZb = L - aeroData.cp_from_nose;   // body-frame z
    const [cpzw, cpxw] = bodyToWorld(cpZb, 0, aoaRad);
    const [, cpy]  = toCv(cpzw, cpxw);
    const [lzw, lxw] = bodyToWorld(cpZb, -R * 1.6, aoaRad);
    const [rzw, rxw] = bodyToWorld(cpZb,  R * 1.6, aoaRad);
    const [cpxL,]  = toCv(lzw, lxw);
    const [cpxR,]  = toCv(rzw, rxw);
    ctx.strokeStyle = '#f97316'; ctx.lineWidth = 1.5;
    ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(cpxL, cpy); ctx.lineTo(cpxR, cpy); ctx.stroke();
    ctx.setLineDash([]);
    document.getElementById('ov-cp').style.display = 'block';
    document.getElementById('ov-cp').style.left = (Math.max(cpxL,cpxR) + 5) + 'px';
    document.getElementById('ov-cp').style.top  = (cpy - 8) + 'px';
  }

  // Note: no flow-direction arrow here — the wind tunnel's airflow is
  // now always straight down the canvas by design (see bodyToWorld /
  // worldToBody above); AoA is shown by the rocket itself rotating,
  // matching a real model on a sting mount rather than a tilting tunnel.
}

// ═══════════════════════════════════════════════════════════════════════════
// CHARTS
// ═══════════════════════════════════════════════════════════════════════════
function drawCurve(canvasId, data, color, cursorX, opts={}) {
  const el = document.getElementById(canvasId);
  if (!el || !data || !data.length) return;
  const W = el.offsetWidth, H = el.offsetHeight;
  el.width = W; el.height = H;
  const c = el.getContext('2d');
  c.clearRect(0, 0, W, H);

  const xs = data.map(d=>d.x), ys = data.map(d=>d.y);
  const xMin = Math.min(...xs), xMax = Math.max(...xs);
  let yMin = Math.min(...ys), yMax = Math.max(...ys);
  const yp = (yMax-yMin)*0.12||0.01; yMin-=yp; yMax+=yp;
  const tx = x => (x-xMin)/(xMax-xMin)*(W-24)+12;
  const ty = y => H-(y-yMin)/(yMax-yMin)*(H-18)-9;

  c.strokeStyle = 'rgba(30,45,61,0.9)'; c.lineWidth = 0.5;
  for (let i=1;i<4;i++){c.beginPath();c.moveTo(0,H*i/4);c.lineTo(W,H*i/4);c.stroke();}

  if (xMin<0&&xMax>0){
    c.strokeStyle='rgba(100,116,139,0.35)';c.lineWidth=0.8;c.setLineDash([3,3]);
    c.beginPath();c.moveTo(tx(0),0);c.lineTo(tx(0),H);c.stroke();c.setLineDash([]);
  }

  c.fillStyle='rgba(100,116,139,0.7)';c.font='8px monospace';
  for(let i=0;i<=4;i++){const x=xMin+(xMax-xMin)*i/4;c.fillText(x.toFixed(0)+'°',tx(x)-6,H-2);}

  c.beginPath();c.strokeStyle=color;c.lineWidth=1.6;
  data.forEach((d,i)=>{i===0?c.moveTo(tx(d.x),ty(d.y)):c.lineTo(tx(d.x),ty(d.y));});
  c.stroke();

  if(cursorX>=xMin&&cursorX<=xMax){
    c.strokeStyle='rgba(249,115,22,0.75)';c.lineWidth=1;
    c.beginPath();c.moveTo(tx(cursorX),0);c.lineTo(tx(cursorX),H);c.stroke();
    const cl=data.reduce((a,b)=>Math.abs(b.x-cursorX)<Math.abs(a.x-cursorX)?b:a);
    if(opts.cursorId) document.getElementById(opts.cursorId).textContent=cl.y.toFixed(4);
  }
  if(opts.ymaxId) document.getElementById(opts.ymaxId).textContent=yMax.toFixed(3);
  if(opts.yminId) document.getElementById(opts.yminId).textContent=yMin.toFixed(3);
}

function drawCharts() {
  if (!aeroData) return;
  if (aeroData.cd_curve) {
    const cd = aeroData.cd_curve.map(p=>({x:p.aoa_deg,y:p.cd}));
    drawCurve('ch-cd', cd, '#22d3ee', aoaDeg, {cursorId:'cv-cd',ymaxId:'cy-cd-max',yminId:'cy-cd-min'});
  }
  const dia = aeroData.rocket_diameter || 0.076;
  const cp  = aeroData.cp_from_nose   || 0;
  const cg  = aeroData.cg || 0;
  if (dia > 0) {
    const sm = Array.from({length:81},(_,i)=>({x:-20+i*0.5, y:(cp-cg)/dia}));
    drawCurve('ch-sm', sm, '#22c55e', aoaDeg, {cursorId:'cv-sm',ymaxId:'cy-sm-max',yminId:'cy-sm-min'});
  }
}

function updateStats() {
  if (!aeroData) return;
  const R   = (aeroData.rocket_diameter||0.076)/2;
  let cd    = aeroData.cd0 || 0.3;
  if (aeroData.cd_curve) {
    const cl = aeroData.cd_curve.reduce((a,b)=>Math.abs(b.aoa_deg-aoaDeg)<Math.abs(a.aoa_deg-aoaDeg)?b:a);
    cd = cl.cd;
  }
  const q    = 0.5 * RHO * airspeed * airspeed;
  const drag = cd * q * Math.PI * R * R;
  document.getElementById('st-cp').textContent   = aeroData.cp_from_nose ? (aeroData.cp_from_nose*1000).toFixed(1)+' mm':'—';
  document.getElementById('st-cd').textContent   = cd.toFixed(4);
  document.getElementById('st-drag').textContent = drag.toFixed(2)+' N';
  document.getElementById('st-q').textContent    = q.toFixed(1)+' Pa';
  document.getElementById('st-aoa-live').textContent = aoaDeg.toFixed(1)+'°';
}

// ═══════════════════════════════════════════════════════════════════════════
// AERO FETCH
// ═══════════════════════════════════════════════════════════════════════════
async function fetchAero() {
  try {
    let d = await (await fetch('/aero')).json();

    // If sim_state has no profile yet (e.g. server restarted since last STL
    // upload), try forcing a re-analysis — the STL file itself persists on
    // disk even though in-memory state resets on restart.
    if ((!d.stl_uploaded || !d.rocket_profile || d.rocket_profile.length < 2)) {
      try {
        const forced = await fetch('/aero/analyze', { method: 'POST' });
        if (forced.ok) {
          const fd = await forced.json();
          d = { ...d, ...fd, stl_uploaded: true };
        }
      } catch(e2) { /* no STL on disk either — stay with fallback shape */ }
    }

    if (d.stl_uploaded && d.rocket_length > 0 && (!aeroData || !aeroData.rocket_length)) {
      aeroData = d;
      if (d.rocket_profile && d.rocket_profile.length > 1) setRocketProfile(d.rocket_profile);
      if (d.flow_field) setFlowField(d.flow_field);
      rebuildStreamlines();
    }
  } catch(e) {}
}
fetchAero();
setInterval(fetchAero, 6000);

// ═══════════════════════════════════════════════════════════════════════════
// WEBSOCKET
// ═══════════════════════════════════════════════════════════════════════════
const ws = new WebSocket(`ws://${location.host}/ws`);
ws.onopen  = () => document.getElementById('ws-status').textContent = 'connected ✓';
ws.onclose = () => document.getElementById('ws-status').textContent = 'disconnected';
ws.onmessage = e => {
  const d = JSON.parse(e.data);
  if (d.cp_location && !aeroData) {
    aeroData = {
      cp_from_nose:   d.cp_location,
      cg:             d.cg_location,
      rocket_length:  d.rocket_length,
      rocket_diameter:d.rocket_diameter,
      stl_uploaded:   d.stl_uploaded,
      cd0: 0.3,
    };
    rebuildStreamlines();
  }
  if (mode==='live') {
    const liveAoA = d.aoa || 0;
    const liveSpd = Math.max(5, d.speed || 30);
    if (Math.abs(liveAoA-aoaDeg)>0.2 || Math.abs(liveSpd-airspeed)>1) {
      aoaDeg = liveAoA; airspeed = Math.min(150, liveSpd);
      document.getElementById('aoa-slider').value = liveAoA;
      document.getElementById('spd-slider').value = Math.min(150,liveSpd);
      document.getElementById('aoa-val').textContent = liveAoA.toFixed(1)+'°';
      document.getElementById('spd-val').textContent  = liveSpd.toFixed(0)+' m/s';
      document.getElementById('ov-aoa-val').textContent='AoA: '+liveAoA.toFixed(1)+'°';
      // Throttled — a real flight's AoA/speed can update this branch at
      // up to 20Hz (the WebSocket broadcast rate), which would hit the
      // exact same freeze risk as dragging the slider quickly.
      scheduleRetrace();
    }
  }
  document.getElementById('st-aoa-live').textContent = (d.aoa||0).toFixed(2)+'°';
};

// ═══════════════════════════════════════════════════════════════════════════
// ANIMATION LOOP
// ═══════════════════════════════════════════════════════════════════════════
function loop() { draw(); requestAnimationFrame(loop); }
loop();
</script>
